<style>
    :root {
        --accent: #60a5fa;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #374151;
        --card: #111827;
        --bg: #000000;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.6;
    }

    main {
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
    }

    h1 {
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        margin-bottom: 0.25rem;
    }

    .intro {
        color: var(--muted);
        margin-top: 0;
    }

    label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
    }

    textarea {
        width: 100%;
        min-height: 110px;
        padding: 0.75rem;
        font: inherit;
        color: var(--text);
        background: #111827;
        border: 1px solid var(--border);
        border-radius: 8px;
        resize: vertical;
    }

    textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
    }

    button {
        margin-top: 0.75rem;
        padding: 0.7rem 1.4rem;
        font: inherit;
        font-weight: 600;
        color: #000000;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    button:hover { opacity: 0.92; }

    #solution-output { margin-top: 2rem; }
    #solution-output:empty { display: none; }

    .solution-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 4px solid var(--accent);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin: 1rem 0;
    }

    .solution-card h3 {
        margin: 0 0 0.4rem;
        font-size: 1.15rem;
    }

    .solution-card p { margin: 0.4rem 0; }

    .match-reason {
        font-size: 0.9rem;
        color: var(--muted);
    }

    a {
        color: var(--accent);
        font-weight: 600;
    }

    @media (max-width: 480px) {
        main { padding: 1.25rem 1rem 3rem; }
        button { width: 100%; }
    }
</style>

</head>
<body>
    <main>
        <h1>Find Your Solution</h1>
        <p class="intro">Describe what you need help with, such as a slow website, a security concern, backups, or computer problems. We will point you to the right service.</p>

        <form id="solution-form" novalidate>
            <label for="solution-query">What do you need help with?</label>
            <textarea id="solution-query" name="query" placeholder="For example: my website is slow on phones and I want better Google rankings"></textarea>
            <button type="submit">Find my solution</button>
        </form>

        <section id="solution-output" aria-live="polite"></section>
    </main>

    <script src="solution-finder.js" defer></script>
</body>
</html>
