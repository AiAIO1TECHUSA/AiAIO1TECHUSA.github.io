<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Solution</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #222;
            line-height: 1.5;
        }
        form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.6rem;
            font-size: 1rem;
            border: 1px solid #aaa;
            border-radius: 4px;
        }
        button {
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
        }
        .solution {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .solution--expanded {
            border-color: #2a6fdb;
        }
        a {
            color: #2a6fdb;
        }
    </style>
</head>
<body>

    <h1>Find Your Solution</h1>
    <p>Describe what you need, for example "my site loads slowly on phones."</p>

    <form id="solution-form">
        <input type="text" id="solution-query" name="query"
               placeholder="Describe your problem" autocomplete="off" required>
        <button type="submit">Search</button>
    </form>

    <div id="solution-output" aria-live="polite"></div>

    <script src="solution-finder.js" defer></script>
</body>
</html>
