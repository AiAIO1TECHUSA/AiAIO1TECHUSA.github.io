<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - AI AIO Tech USA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        #submitBtn {
            background: #667eea;
            color: white;
        }

        #submitBtn:hover:not(:disabled) {
            background: #5568d3;
        }

        #submitBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #sendCodeBtn {
            background: #48bb78;
            color: white;
        }

        #sendCodeBtn:hover:not(:disabled) {
            background: #38a169;
        }

        #sendCodeBtn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .verification-code-div {
            display: none;
            margin-bottom: 20px;
            padding: 15px;
            background: #f7fafc;
            border-left: 4px solid #48bb78;
            border-radius: 4px;
        }

        .verification-message {
            font-size: 13px;
            margin-top: 8px;
            padding: 8px 0;
        }

        .verification-message.error {
            color: #c53030;
        }

        .verification-message.success {
            color: #22543d;
        }

        .h-captcha {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        .success-message {
            display: none;
            background: #c6f6d5;
            border: 1px solid #9ae6b4;
            color: #22543d;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Contact Form Styles */
        .contact-form-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        #contactForm {
            display: none;
        }

        .calendar-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .calendar-link:hover {
            background: #5568d3;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Register</h1>
        <p class="subtitle">Get access to the interactive legal memo</p>

        <div id="successMessage" class="success-message">
            ✅ Registration successful! Redirecting...
        </div>

        <!-- Registration Form -->
        <form id="registrationForm">
            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="regEmail">Email Address *</label>
                <input type="email" id="regEmail" name="regEmail" required aria-describedby="emailError">
            </div>

            <!-- Send Verification Code -->
            <div class="form-group">
                <button type="button" id="sendCodeBtn">Send Code</button>
            </div>

            <!-- Verification Code Input -->
            <div id="verificationCodeDiv" class="verification-code-div">
                <label for="verificationCode">Verification Code *</label>
                <input type="number" id="verificationCode" name="verificationCode" placeholder="Enter 6-digit code">
                <div id="verificationMessage" class="verification-message"></div>
            </div>

            <!-- hCaptcha -->
            <div class="h-captcha" data-sitekey="c6161412-56f8-4014-96f4-058eba2a53b0"></div>

            <!-- Want Contact Checkbox -->
            <div class="checkbox-group">
                <input type="checkbox" id="wantContact" name="wantContact">
                <label for="wantContact" class="checkbox-label">I want to schedule a consultation</label>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" disabled>Register & Print</button>
        </form>

        <!-- Contact Form (Outside registration form) -->
        <div class="contact-form-section">
            <form id="contactForm">
                <h2 style="font-size: 18px; margin-bottom: 15px;">Schedule a Consultation</h2>
                
                <div class="form-group">
                    <label for="contactEmail">Email *</label>
                    <input type="email" id="contactEmail" name="contactEmail" required>
                </div>

                <a href="https://calendly.com/patlucero2026" target="_blank" class="calendar-link">
                    Open Calendly to Schedule
                </a>
                <p style="font-size: 12px; color: #666; margin-top: 10px;">
                    ℹ️ You'll be taken to our scheduling page. We'll send you a confirmation email.
                </p>
            </form>
        </div>
    </div>

    <!-- EmailJS Script -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/index.min.js"></script>
    
    <!-- hCaptcha Script -->
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>

    <!-- Main Registration Script -->
    <script>
        // Initialize EmailJS
        emailjs.init('DeMxOZxL9YIsMfNzR');

        // DOM Elements
        const registrationForm = document.getElementById('registrationForm');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('regEmail');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const verificationCodeDiv = document.getElementById('verificationCodeDiv');
        const verificationCodeInput = document.getElementById('verificationCode');
        const verificationMessage = document.getElementById('verificationMessage');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');
        const wantContactCheckbox = document.getElementById('wantContact');
        const contactForm = document.getElementById('contactForm');
        const contactEmail = document.getElementById('contactEmail');

        // State
        let generatedCode = null;
        let isEmailVerified = false;

        // Helper: Generate 6-digit code
        function generateCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // Helper: Show message
        function showMessage(text, type) {
            verificationMessage.textContent = text;
            verificationMessage.className = `verification-message ${type}`;
        }

        // Helper: Validate email format
        function isValidEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        // Send verification email
        async function sendVerificationEmail(email, code) {
            try {
                await emailjs.send(
                    'service_ti0gxwd',
                    'template_pdtwbfi',  // Email Verification Template
                    {
                        to_email: email,
                        verification_code: code,
                        expiry_time: '10 minutes'
                    }
                );
                return true;
            } catch (error) {
                console.error('EmailJS error:', error);
                return false;
            }
        }

        // Send contact email
        async function sendContactEmail(fullName, email) {
            try {
                await emailjs.send(
                    'service_ti0gxwd',
                    'template_lshjrs3',  // Contact Template
                    {
                        to_email: 'patlucero2025@proton.me',
                        from_name: fullName,
                        from_email: email,
                        message: `${fullName} (${email}) has registered and requested to schedule a consultation for the legal memo.`
                    }
                );
                return true;
            } catch (error) {
                console.error('EmailJS error:', error);
                return false;
            }
        }

        // "Send Code" Button Handler
        sendCodeBtn.addEventListener('click', async function() {
            const email = emailInput.value.trim();

            if (!email) {
                showMessage('Please enter your email first.', 'error');
                return;
            }

            if (!isValidEmail(email)) {
                showMessage('Please enter a valid email.', 'error');
                return;
            }

            // Generate code
            generatedCode = generateCode();
            isEmailVerified = false;
            verificationCodeInput.value = '';

            // Send verification email
            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = 'Sending...';

            const sent = await sendVerificationEmail(email, generatedCode);

            if (sent) {
                showMessage('✅ Code sent! Check your email.', 'success');
                verificationCodeDiv.style.display = 'block';
                verificationCodeInput.focus();
            } else {
                showMessage('❌ Failed to send code. Try again.', 'error');
            }

            sendCodeBtn.disabled = false;
            sendCodeBtn.textContent = 'Send Code';
        });

        // Verify code when user enters it
        verificationCodeInput.addEventListener('input', function() {
            if (this.value === generatedCode) {
                isEmailVerified = true;
                showMessage('✅ Email verified!', 'success');
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            } else if (this.value.length === 6) {
                showMessage('❌ Code incorrect. Try again.', 'error');
            }
        });

        // Registration Form Submit
        registrationForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            // Check if email is verified
            if (!isEmailVerified) {
                alert('Please verify your email first.');
                return;
            }

            // Validate captcha
            const captchaResponse = document.querySelector('[name="h-captcha-response"]');
            if (!captchaResponse || !captchaResponse.value) {
                alert('Please complete the captcha.');
                return;
            }

            const fullName = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            const wantContact = wantContactCheckbox.checked;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Registering...';

            try {
                // Send contact email if requested
                if (wantContact) {
                    await sendContactEmail(fullName, email);
                }

                // Save to localStorage
                localStorage.setItem('printAccessEmail', email);
                localStorage.setItem('printAccessTime', Date.now());

                // Show success
                successMessage.style.display = 'block';

                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'legal-memo-interactive.htm';
                }, 2000);

            } catch (error) {
                console.error('Registration error:', error);
                alert('Registration error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register & Print';
            }
        });

        // Contact form toggle
        wantContactCheckbox.addEventListener('change', function() {
            if (this.checked) {
                contactForm.style.display = 'block';
                contactEmail.value = emailInput.value;
            } else {
                contactForm.style.display = 'none';
            }
        });

        // Update contact email when registration email changes
        emailInput.addEventListener('change', function() {
            if (wantContactCheckbox.checked) {
                contactEmail.value = this.value;
            }
        });

        // Disable submit button initially
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.5';

        // Check existing access on page load
        window.addEventListener('load', () => {
            const accessEmail = localStorage.getItem('printAccessEmail');
            const accessTime = localStorage.getItem('printAccessTime');

            if (accessEmail && accessTime) {
                const oneWeekMs = 7 * 24 * 60 * 60 * 1000;
                if (Date.now() - parseInt(accessTime) < oneWeekMs) {
                    window.location.href = 'legal-memo-interactive.htm';
                }
            }
        });
    </script>
</body>
</html>
