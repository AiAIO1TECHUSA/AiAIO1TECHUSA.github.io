<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Wager Agent - HuggingFace Edition</title>
    <link rel="preconnect" href="https://api-inference.huggingface.co">
    <link rel="stylesheet" href="sports-bet-agent-hf.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🏆 Sports Wager Agent</h1>
            <p>AI-Powered Sports Pick Analysis</p>
            <span class="badge">Serverless Inference Edition</span>
        </header>

        <main class="content">
            <form id="wagerForm">
                <div class="form-section">
                    <div class="form-group">
                        <label for="homeTeam">Home Team *</label>
                        <input type="text" id="homeTeam" name="homeTeam" placeholder="e.g., Kansas City Chiefs" required>
                    </div>
                    <div class="form-group">
                        <label for="awayTeam">Away Team *</label>
                        <input type="text" id="awayTeam" name="awayTeam" placeholder="e.g., Buffalo Bills" required>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-group">
                        <label for="sport">Sport *</label>
                        <select id="sport" name="sport" required>
                            <option value="">-- Select Sport --</option>
                            <option value="NFL">NFL</option>
                            <option value="NBA">NBA</option>
                            <option value="MLB">MLB</option>
                            <option value="NHL">NHL</option>
                            <option value="College Football">College Football</option>
                            <option value="College Basketball">College Basketball</option>
                            <option value="Soccer">Soccer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="wagerType">Wager Type *</label>
                        <select id="wagerType" name="wagerType" required>
                            <option value="">-- Select Type --</option>
                            <option value="Moneyline">Moneyline</option>
                            <option value="Spread">Spread</option>
                            <option value="Over/Under">Over/Under</option>
                            <option value="Parlay">Parlay</option>
                        </select>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-group">
                        <label for="oddsLine">Odds/Line *</label>
                        <input type="text" id="oddsLine" name="oddsLine" placeholder="e.g., -110, +200, -3.5" required>
                    </div>
                    <div class="form-group">
                        <label for="gameDate">Game Date/Time (Optional)</label>
                        <input type="datetime-local" id="gameDate" name="gameDate">
                    </div>
                </div>

                <div class="form-section full">
                    <div class="form-group">
                        <label for="additionalContext">Additional Context (Optional)</label>
                        <textarea id="additionalContext" name="additionalContext" placeholder="Any injuries, weather, streaks, or other factors..." rows="4"></textarea>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary" id="submitBtn">🔍 Initiate AI Wager Scan</button>
                    <button type="reset" class="btn-secondary">Clear Form</button>
                </div>
            </form>

            <div id="loading" class="loading" role="status" aria-live="polite">
                <div class="spinner"></div>
                <p>AI is analyzing the matchup...</p>
            </div>

            <section id="resultsSection" class="results-section" aria-live="polite">
                <h2 style="margin-bottom: 25px; color: #333;">📊 AI Analysis Results</h2>
                <div id="resultsContainer"></div>
            </section>

            <div id="errorSection" class="error" role="alert" style="display: none;">
                <strong id="errorTitle">Error</strong>
                <p id="errorMessage"></p>
            </div>
        </main>

        <footer class="footer">
            <p>
                Built with <strong>HuggingFace Inference API</strong> |
                <a href="https://huggingface.co/meta-llama/Llama-2-7b-chat-hf" target="_blank" rel="noopener noreferrer">Powered by Llama 2</a>
            </p>
            <p style="margin-top: 10px; font-size: 0.85em;">
                ⚠️ For educational purposes only. AI analysis may be inaccurate; always do your own research.
            </p>
        </footer>
    </div>
    <script src="sports-bet-agent-hf.js" defer></script>
</body>
</html>
