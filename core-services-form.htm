<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core Services Form</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 1.6rem; }
  .group { margin: 24px 0 8px; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
  .item { display: flex; align-items: center; padding: 6px 0; }
  .item input { margin-right: 10px; }
  .item span.price { margin-left: auto; color: #555; }
  .total-box { margin-top: 28px; padding: 16px; background: #f4f6f8; border-radius: 6px; font-size: 1.2rem; }
  .btn { display: inline-block; margin-top: 16px; padding: 12px 20px; background: #1a73e8; color: #fff; text-decoration: none; border-radius: 5px; border: none; font-size: 1rem; cursor: pointer; }
  .btn:hover { background: #155bb5; }
  .note { font-size: 0.85rem; color: #666; margin-top: 8px; }
</style>
</head>
<body>

<h1>Core Services</h1>
<p>Last updated: <span id="publish-date"></span></p>

<div class="group">Hardware and Infrastructure</div>
<label class="item"><input type="checkbox" class="svc" data-price="900"> Windows Server License <span class="price">$900</span></label>
<label class="item"><input type="checkbox" class="svc" data-price="1500"> Server Hardware <span class="price">$1,500</span></label>
<label class="item"><input type="checkbox" class="svc" data-price="250"> Business Router/Firewall <span class="price">$250</span></label>
<label class="item"><input type="checkbox" class="svc" data-price="200"> UPS Backup Power <span class="price">$200</span></label>
<label class="item"><input type="checkbox" class="svc" data-price="600"> Install &amp; Config <span class="price">$600</span></label>
<label class="item"><input type="checkbox" class="svc" data-price="150"> Monthly Maintenance <span class="price">$150</span></label>

<div class="group">Hourly Services</div>
<label class="item"><input type="checkbox" class="svc" data-price="30"> Personal Injury Chronology <span class="price">$30/hr</span></label>
<label class="item"><input type="checkbox" class="svc" data-price="20"> Web 3.0 Layout <span class="price">$20/hr</span></label>
<label class="item"><input type="checkbox" class="svc" data-price="50"> JavaScript AI Workflow <span class="price">$50/hr</span></label>

<div class="group">Security</div>
<label class="item"><input type="checkbox" class="svc" data-price="100"> Cyber Security Update <span class="price">$100</span></label>

<div class="total-box">
  Total: $<span id="totalPrice">0</span>
  <div class="note">Hourly services are estimated per hour. Final pricing is confirmed after consultation.</div>
</div>

<a class="btn" href="YOUR-BOOKING-LINK" target="_blank" rel="noopener">Schedule Appointment</a>

<script>
  // Set today's date
  document.getElementById('publish-date').textContent = new Date().toLocaleDateString('en-US', {
    year: 'numeric', month: 'long', day: 'numeric'
  });

  // Recalculate total whenever a checkbox changes
  const checkboxes = document.querySelectorAll('.svc');
  const totalEl = document.getElementById('totalPrice');

  function updateTotal() {
    let total = 0;
    checkboxes.forEach(cb => {
      if (cb.checked) total += Number(cb.dataset.price);
    });
    totalEl.textContent = total.toLocaleString('en-US');
  }

  checkboxes.forEach(cb => cb.addEventListener('change', updateTotal));
  updateTotal();
</script>

</body>
</html>
