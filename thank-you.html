<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Thank You | IT Solutions BCPCORNER</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1f3a5f 0%, #3b6ea5 100%);
      color: #ffffff;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      color: #1f2937;
      border-radius: 18px;
      padding: 40px 32px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
    }
    h1 { margin-top: 0; font-size: 1.8rem; }
    p { line-height: 1.6; }
    a.button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      min-height: 44px;
      line-height: 20px;
      border-radius: 10px;
      background: #3b6ea5;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }
    a.button:hover { background: #1f3a5f; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Thank you!</h1>
    <p>Your message has been sent. I'll reply to the email address you provided, usually within one business day.</p>
    <a href="#" id="return-home" class="btn">Return to Home</a>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
        const button = document.getElementById("return-home");
        const params = new URLSearchParams(window.location.search);
        const from = params.get("from");
        const allowedPrefix = "https://aiaio1techusa.github.io/";
        button.href = (from && from.startsWith(allowedPrefix))
            ? from
            : allowedPrefix;
    });
</script>
</body>
</html>
