<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hCaptcha Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input[type="email"],
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .h-captcha {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        button {
            width: 100%;
            padding: 14px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .debug-info {
            margin-top: 30px;
            padding: 16px;
            background: #f5f5f5;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #333;
            max-height: 200px;
            overflow-y: auto;
        }

        .debug-info h3 {
            font-size: 12px;
            margin-bottom: 8px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact & Verification</h1>
        <p class="subtitle">Complete the form below to reach out</p>

        <form id="contactForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="John Doe" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="john@example.com" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea 
                    id="message" 
                    name="message" 
                    placeholder="Your message here..." 
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label>Prove you're human</label>
                <div class="h-captcha" data-sitekey="c6161412-56f8-4014-96f4-058eba2a53b0"></div>
            </div>

            <button type="submit" id="submitBtn">Submit</button>
        </form>

        <div id="message" class="message"></div>

        <div class="debug-info">
            <h3>Debug Console</h3>
            <div id="debugOutput"></div>
        </div>
    </div>

    <!-- hCaptcha Library -->
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>

    <!-- Form Handler -->
    <script>
        class ContactFormHandler {
            constructor() {
                this.form = document.getElementById('contactForm');
                this.submitBtn = document.getElementById('submitBtn');
                this.messageEl = document.getElementById('message');
                this.debugOutput = document.getElementById('debugOutput');
                this.hcaptchaSiteKey = 'c6161412-56f8-4014-96f4-058eba2a53b0';
                this.formSubmitEndpoint = 'https://formsubmit.co/patlucero2025@proton.me';
                
                this.init();
            }

            init() {
                this.log('ContactFormHandler initialized');
                this.form.addEventListener('submit', (e) => this.handleSubmit(e));
            }

            log(message) {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = `[${timestamp}] ${message}`;
                console.log(logEntry);
                
                const p = document.createElement('p');
                p.textContent = logEntry;
                this.debugOutput.appendChild(p);
                this.debugOutput.scrollTop = this.debugOutput.scrollHeight;
            }

            async handleSubmit(e) {
                e.preventDefault();
                this.log('Form submission started');
                
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const message = document.getElementById('message').value.trim();

                if (!name || !email || !message) {
                    this.showError('Please fill in all fields');
                    this.log('ERROR: Missing required fields');
                    return;
                }

                this.log(`Name: ${name}, Email: ${email}`);

                const token = hcaptcha.getResponse();
                
                if (!token) {
                    this.showError('Please complete the hCaptcha');
                    this.log('ERROR: hCaptcha token missing');
                    return;
                }

                this.log(`hCaptcha token received: ${token.substring(0, 20)}...`);

                this.submitBtn.disabled = true;
                this.submitBtn.textContent = 'Sending...';

                try {
                    // Create FormData for FormSubmit.co
                    const formData = new FormData();
                    formData.append('name', name);
                    formData.append('email', email);
                    formData.append('message', message);
                    formData.append('h-captcha-response', token);
                    formData.append('_captcha', 'false'); // Disable FormSubmit's built-in captcha

                    const response = await fetch(this.formSubmitEndpoint, {
                        method: 'POST',
                        body: formData
                    });

                    this.log(`Server response: ${response.status} ${response.statusText}`);

                    if (response.ok) {
                        this.showSuccess('Message sent successfully! Check your email.');
                        this.log('Form submitted successfully');
                        this.form.reset();
                        hcaptcha.reset();
                    } else {
                        this.showError('Submission failed. Please try again.');
                        this.log(`ERROR: Server returned ${response.status}`);
                    }
                } catch (error) {
                    this.showError(`Error: ${error.message}`);
                    this.log(`ERROR: ${error.message}`);
                } finally {
                    this.submitBtn.disabled = false;
                    this.submitBtn.textContent = 'Submit';
                }
            }

            showSuccess(message) {
                this.messageEl.className = 'message success';
                this.messageEl.textContent = message;
            }

            showError(message) {
                this.messageEl.className = 'message error';
                this.messageEl.textContent = message;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new ContactFormHandler();
        });
    </script>
</body>
</html>
