name: Deploy to GitHub Pages with API Key

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Generate config file with HuggingFace API key
  run: |
    cat > sports-bet-agent-config.js << 'EOF'
    window.HUGGINGFACE_API_KEY = '${{ secrets.HUGGINGFACE_API_KEY }}';
    console.log('✅ API key injected into window object');
    EOF
    cat sports-bet-agent-config.js
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
