name: Deploy with API Key Injection

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Inject HuggingFace API Key into HTML
        run: |
          # This creates a config file with your secret (only during deployment)
          cat > sports-bet-agent-config.js << EOF
          // ⚠️ This file is generated during deployment and NOT committed to Git
          window.HFCONFIG = {
            API_KEY: '${{ secrets.HUGGINGFACE_API_KEY }}'
          };
          EOF
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          cname: aiaio1techusa.github.io
